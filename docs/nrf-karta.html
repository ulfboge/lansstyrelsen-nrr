<title>NRF-kartan</title>
<style>
  :root{
    --paper:#FBF6DE;
    --paper-deep:#F4EDC4;
    --ink:#2B2E18;
    --ink-soft:#5B5E42;
    --line:#D8D0A0;
    --olive:#444D26;
    --olive-deep:#333A1C;
    --sage:#A5B592;
    --orange:#F3A447;
    --yellow:#E7BC29;
    --pink:#D092A7;
    --purple:#9C85C0;
    --blue:#809EC2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Open Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    height:100vh; width:100vw;
    position:relative;
  }
  ::selection{background:var(--yellow);color:var(--olive-deep);}
  svg{ display:block; width:100vw; height:100vh; }

  /* ---- content inside foreignObject (vector-hosted HTML) ---- */
  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:0 1px 2px rgba(43,46,24,.06), 0 8px 24px rgba(43,46,24,.10);
    padding:26px 30px; width:100%; height:100%;
    font-family:"Open Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; justify-content:center;
  }
  .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px; }
  .card h2{ font-size:23px; line-height:1.2; margin:0 0 12px; font-weight:700; }
  .card .body, .card ul{ font-size:14.5px; line-height:1.55; color:var(--ink); margin:0; padding-left:19px; }
  .card li{ margin:0 0 7px; }
  .card li:last-child{ margin-bottom:0; }

  .hub{
    width:100%; height:100%; border-radius:50%;
    background:var(--olive); color:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px;
  }
  .hub .h1{ font-size:40px; font-weight:800; letter-spacing:.02em; margin:0; }
  .hub .h2{ font-size:15px; font-weight:600; margin:10px 0 0; opacity:.92; line-height:1.4; }

  .tag{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; margin-bottom:10px; }
  .tag.led{ background:#fbe6cf; color:#8a4c0f; }
  .tag.gra{ background:#e4ecdd; color:#3f5228; }
  .tag.ext{ background:#e6ddf0; color:#4e3670; }

  .area-row{ display:flex; gap:10px; height:calc(100% - 44px); }
  .area-card{ flex:1; min-width:0; border-radius:10px; padding:14px; text-align:center;
    background:var(--paper-deep); border:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; }
  .area-card.muted{ background:#fff; }
  .area-card b{ display:block; font-size:14px; margin-bottom:6px; }
  .area-card span{ font-size:12px; color:var(--ink-soft); line-height:1.4; display:block; }

  /* parent-frame chrome: section wash + label */
  .bg-rect{ fill:#FBF6DE; }
  .frame-wash{ fill:#fff; opacity:.55; stroke:#D8D0A0; stroke-width:2; }
  .frame-label{
    font-family:"Open Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    font-weight:800; fill:var(--olive-deep);
  }
  .frame-hint{
    font-family:"Open Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    font-weight:600; fill:var(--ink-soft);
  }

  .yearcard{ background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 6px 18px rgba(43,46,24,.08);
    width:100%; height:100%; padding:20px; display:flex; flex-direction:column; justify-content:center; }
  .yearcard .yr{ font-weight:800; font-size:30px; margin:0 0 4px; }
  .yearcard .sub{ font-size:13.5px; font-weight:700; color:var(--ink-soft); margin:0 0 12px; }
  .yearcard ul{ font-size:14px; padding-left:18px; margin:0; line-height:1.55; }
  .yearcard li{ margin-bottom:8px; }

  .stepcard{ background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 6px 18px rgba(43,46,24,.08);
    width:100%; height:100%; padding:18px; display:flex; flex-direction:column; justify-content:center; }
  .stepcard .num{ width:34px; height:34px; border-radius:50%; background:var(--sage); color:var(--olive-deep);
    font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; flex:none; }
  .stepcard h4{ font-size:15px; margin:0 0 8px; line-height:1.3; }
  .stepcard p{ font-size:13px; color:var(--ink-soft); margin:0; line-height:1.5; }

  /* ---- chrome (real DOM, never rescaled — always crisp) ---- */
  .chrome{ position:fixed; inset:0 0 auto 0; z-index:40; display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px; pointer-events:none; }
  .chrome > *{ pointer-events:auto; }
  .brand{ display:flex; align-items:baseline; gap:10px; font-weight:700; }
  .brand .mark{ background:var(--olive); color:var(--paper); font-size:13px; font-weight:700; letter-spacing:.06em;
    padding:5px 9px; border-radius:5px; }
  .brand .crumb{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .brand .crumb b{ color:var(--ink); }

  .audience{ display:flex; gap:2px; background:var(--paper-deep); border:1px solid var(--line); border-radius:999px;
    padding:3px; box-shadow:0 1px 2px rgba(43,46,24,.06), 0 8px 24px rgba(43,46,24,.10); }
  .audience button{ appearance:none; border:0; background:transparent; cursor:pointer; font-family:inherit; font-size:12.5px;
    font-weight:600; color:var(--ink-soft); padding:7px 13px; border-radius:999px; transition:background .15s, color .15s; white-space:nowrap; }
  .audience button.active{ background:var(--olive); color:var(--paper); }
  .audience button:focus-visible{ outline:2px solid var(--olive); outline-offset:2px; }

  .controls{ position:fixed; left:0; right:0; bottom:22px; z-index:40; display:flex; align-items:center; justify-content:center;
    gap:16px; pointer-events:none; }
  .controls > *{ pointer-events:auto; }
  .navbtn{ width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--olive-deep);
    font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 2px rgba(43,46,24,.06), 0 8px 24px rgba(43,46,24,.10); transition:background .15s; }
  .navbtn:disabled{ opacity:.35; cursor:default; }
  .navbtn:not(:disabled):hover{ background:var(--paper-deep); }
  .navbtn:focus-visible{ outline:2px solid var(--olive); outline-offset:2px; }
  .dots{ display:flex; gap:7px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:9px 14px; box-shadow:0 1px 2px rgba(43,46,24,.06), 0 8px 24px rgba(43,46,24,.10); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); cursor:pointer; border:0; padding:0; }
  .dot.active{ background:var(--olive); width:18px; border-radius:4px; transition:width .2s; }

  .upbtn{ position:fixed; left:22px; top:78px; z-index:40; display:none; align-items:center; gap:7px;
    background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 14px 8px 10px; cursor:pointer;
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--olive-deep);
    box-shadow:0 1px 2px rgba(43,46,24,.06), 0 8px 24px rgba(43,46,24,.10); }
  .upbtn.show{ display:flex; }

  .hint{ position:fixed; right:20px; bottom:22px; z-index:40; font-size:11.5px; color:var(--ink-soft); background:#fff;
    border:1px solid var(--line); padding:8px 12px; border-radius:10px; box-shadow:0 1px 2px rgba(43,46,24,.06), 0 8px 24px rgba(43,46,24,.10);
    max-width:280px; line-height:1.5; }
  .hint kbd{ background:var(--paper-deep); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-family:inherit; font-size:10.5px; }

  .zoomctl{ position:fixed; left:22px; bottom:22px; z-index:40; display:flex; flex-direction:column; background:#fff;
    border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 2px rgba(43,46,24,.06), 0 8px 24px rgba(43,46,24,.10); overflow:hidden; }
  .zoomctl button{ appearance:none; border:0; background:transparent; width:38px; height:34px; cursor:pointer; font-size:16px;
    color:var(--olive-deep); font-family:inherit; }
  .zoomctl button:first-child{ border-bottom:1px solid var(--line); }
  .zoomctl button:hover{ background:var(--paper-deep); }
</style>

<svg id="stage" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" class="bg-rect" x="-2000" y="-2000" width="10200" height="6800"></rect>
  <path id="path" d="" fill="none" stroke="#A5B592" stroke-width="5" stroke-dasharray="1 20" stroke-linecap="round"></path>
  <g id="frames"></g>
</svg>

<div class="chrome">
  <div class="brand">
    <span class="mark">NRF</span>
    <span class="crumb" id="crumb">Kartläggning av livsmiljötyper i skyddade områden</span>
  </div>
  <div class="audience" role="group" aria-label="Hoppa till målgrupp">
    <button data-aud="aud-led" class="active">Ledningsgrupp</button>
    <button data-aud="aud-gra">Grannenhet</button>
    <button data-aud="aud-ext">Externa aktörer</button>
  </div>
</div>

<button class="upbtn" id="upbtn">↑ Zooma ut till <span id="upbtn-label">helheten</span></button>

<div class="zoomctl">
  <button id="zoomIn" aria-label="Zooma in">+</button>
  <button id="zoomOut" aria-label="Zooma ut">−</button>
</div>

<div class="controls">
  <button class="navbtn" id="prev" aria-label="Föregående">‹</button>
  <div class="dots" id="dots"></div>
  <button class="navbtn" id="next" aria-label="Nästa">›</button>
</div>

<div class="hint"><b>Piltangenter</b> ‹ › i sidled · <kbd>↓</kbd> zooma in i en del · <kbd>↑</kbd>/<kbd>Esc</kbd> zooma ut · <kbd>0</kbd> hela kartan · scroll för att panorera, <kbd>Ctrl</kbd>+scroll för att zooma fritt</div>

<script>
(function(){
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  var XHTML = "http://www.w3.org/1999/xhtml";

  // ---------------------------------------------------------------
  // 1. Innehåll och layout — nästlade ramar i ETT delat koordinatsystem.
  //    Att zooma är att byta SVG-viewBox, aldrig en CSS-transform:
  //    webbläsaren ritar då om texten från sina konturer varje bildruta,
  //    så den förblir skarp oavsett zoomnivå (till skillnad från en
  //    skalad bitmap, som blir suddig).
  // ---------------------------------------------------------------
  function rect(x,y,w,h){ return {x:x,y:y,w:w,h:h}; }

  var FRAMES = {
    hub: {
      parent:null, kind:"hub", rect: rect(80,980,600,600),
      html: '<div class="hub"><p class="h1">NRF</p><p class="h2">Kartläggning av livsmiljötyper<br>i skyddade områden</p></div>'
    },
    "vad-ar-nrf": {
      parent:null, kind:"card", rect: rect(900,140,760,680), accent:"#A5B592",
      html: card("Bakgrund","Vad är naturrestaureringsförordningen?", [
        "EU-förordning (2024/1991), i kraft augusti 2024 — direkt bindande",
        "Mål: restaurering på minst 20 % av EU:s land och hav till 2030, alla ekosystem i behov till 2050",
        "Livsmiljötyper: tillståndet ska vara känt för minst 90 % av arealen till 2030",
        "Sverige lämnar nationell restaureringsplan till EU — utkast 2026, slutlig 2027"
      ])
    },
    uppdrag: {
      parent:null, kind:"card", rect: rect(1900,980,700,620),
      html: card("Uppdraget","Länsstyrelsernas uppdrag", [
        "Bedöma vilka livsmiljötyper som finns och deras areal",
        "Bedöma tillstånd: gott, inte gott eller okänt — med underlag och datum",
        "Där tillståndet är okänt: en plan för hur det ska bli känt"
      ])
    },
    omraden: {
      parent:null, kind:"areas", rect: rect(900,1820,760,560),
      html: '<div class="card"><p class="eyebrow">Omfattning</p><h2>Vilka områden ingår?</h2>' +
        '<div class="area-row">' +
        '<div class="area-card"><b>Natura 2000</b><span>Utpekade enligt art- och habitat­direktivet (SCI/SAC)</span></div>' +
        '<div class="area-card"><b>Naturreservat</b><span>Alla naturreservat i länet</span></div>' +
        '<div class="area-card muted"><b>Nationalparker</b><span>Ingår i uppdraget — finns inte i Södermanland</span></div>' +
        '</div></div>'
    },
    varfor: {
      parent:null, kind:"card", rect: rect(2850,140,760,680),
      html: card("Motivering","Varför är det viktigt?", [
        "Samlad bild av vad som finns och hur det mår",
        "Grund för restaurering, skydd och uppföljning över tid",
        "Underlag för att revidera beslut, skötsel- och bevarandeplaner",
        "Sveriges rapportering till EU: Natura 2000 (SDF) och artikel 17 (nästa 2031)"
      ])
    },
    tidsplan: {
      parent:null, kind:"parent", rect: rect(2850,980,1500,760), label:"Tidsplan i tre steg",
      children:["tp-2026","tp-2027","tp-2028"]
    },
    "tp-2026": { parent:"tidsplan", kind:"year", accent:"#c67a12",
      data:{yr:"2026", sub:"Natura 2000", pts:["Areal i gott / inte gott tillstånd (där känt)","Areal med okänt tillstånd redovisas","Plan för hur okänt ska bli känt"]} },
    "tp-2027": { parent:"tidsplan", kind:"year", accent:"#444D26",
      data:{yr:"2027", sub:"Natura 2000 + naturreservat", pts:["Natura 2000 klart och slutredovisat","Naturreservat: areal per tillstånd","Ny SDF ifylld (enligt NV)"]} },
    "tp-2028": { parent:"tidsplan", kind:"year", accent:"#5b4a86",
      data:{yr:"2028", sub:"Alla skyddade områden", pts:["Allt i NNK","Åtgärdsområden i IT-stöd för skötsel","NNK → SDF-rapportering till EU"]} },

    "hur-vi-jobbar": {
      parent:null, kind:"parent", rect: rect(4550,140,1500,680), label:"Hur vi jobbar",
      children:["steg1","steg2","steg3","steg4"]
    },
    steg1:{ parent:"hur-vi-jobbar", kind:"step", data:{n:1,h:"Skrivbords­granskning",p:"Utbredning och gränser för livsmiljötyper"} },
    steg2:{ parent:"hur-vi-jobbar", kind:"step", data:{n:2,h:"Registrera tillstånd",p:"I NNK där kunskapen redan finns"} },
    steg3:{ parent:"hur-vi-jobbar", kind:"step", data:{n:3,h:"Systematisk genomgång",p:"Område för område, livsmiljötyp för livsmiljötyp"} },
    steg4:{ parent:"hur-vi-jobbar", kind:"step", data:{n:4,h:"Kunskapsläge + plan",p:"Sammanställning och plan för det som är okänt"} },

    "var-ar-vi-nu": {
      parent:null, kind:"card", rect: rect(4550,980,700,560),
      html: card("Status idag","Var är vi nu?", [
        "Skrivbordsgranskning av utbredning och gränser pågår",
        "NNK-attribut för tillstånd driftsatta — registrering pågår",
        "Nästa: kunskapsläge + plan för 2027, underlag till årsredovisningen"
      ])
    },

    audience: {
      parent:null, kind:"parent", rect: rect(3450,1900,1500,650), label:"Vad innebär det för er?",
      children:["aud-led","aud-gra","aud-ext"]
    },
    "aud-led":{ parent:"audience", kind:"aud", tagClass:"led", tagText:"Ledningsgruppen",
      pts:["Leveranser till regeringen 2026 och 2027","Resursbehov: [komplettera personveckor 2026/2027]","Okänt tillstånd kräver fältinventering 2027 — beslut om resurser","Risk: stor andel okänt hinner inte bli känt till 2028"] },
    "aud-gra":{ parent:"audience", kind:"aud", tagClass:"gra", tagText:"Grannenheten",
      pts:["Ni är vår viktigaste kunskapskälla om tillståndet","Vi kommer med konkreta frågor per område","Ni får en uppdaterad bild i NNK till skötsel- och bevarandeplaner","Gemensam rutin för vem som ändrar vad i NNK"] },
    "aud-ext":{ parent:"audience", kind:"aud", tagClass:"ext", tagText:"Externa aktörer",
      pts:["Kartläggningen ändrar inte reglerna för området","Er kunskap om området är värdefull — vi hör av oss","Ni får en tydligare bild av naturvärden och tillstånd","Bättre underlag för dialog om skötsel och åtgärder"] }
  };

  var ROOT_ORDER = ["hub","vad-ar-nrf","uppdrag","omraden","varfor","tidsplan","hur-vi-jobbar","var-ar-vi-nu","audience"];
  var LABELS = {
    hub:"Start", "vad-ar-nrf":"Bakgrund", uppdrag:"Uppdraget", omraden:"Områden", varfor:"Varför",
    tidsplan:"Tidsplan", "hur-vi-jobbar":"Hur vi jobbar", "var-ar-vi-nu":"Status", audience:"Målgrupper"
  };

  function card(eyebrow, title, items){
    var lis = items.map(function(t){ return "<li>"+t+"</li>"; }).join("");
    return '<div class="card"><p class="eyebrow">'+eyebrow+'</p><h2>'+title+'</h2><ul>'+lis+'</ul></div>';
  }

  // ---- layout: place children evenly inside their parent's rect ----
  (function layoutChildren(){
    Object.keys(FRAMES).forEach(function(id){
      var f = FRAMES[id];
      if(f.kind !== "parent") return;
      var pad = 60, top = 170, gap = 44;
      var n = f.children.length;
      var innerW = f.rect.w - pad*2;
      var cw = (innerW - gap*(n-1)) / n;
      var ch = f.rect.h - top - pad;
      f.children.forEach(function(cid, i){
        FRAMES[cid].rect = rect(f.rect.x + pad + i*(cw+gap), f.rect.y + top, cw, ch);
      });
    });
  })();

  // ---------------------------------------------------------------
  // 2. Rendera varje ram som <rect> (kort) + <foreignObject> (text).
  //    Ingenting animeras med CSS transform — det är bara viewBox
  //    på hela scenen som rör sig, så allt innehåll ritas om skarpt.
  // ---------------------------------------------------------------
  var framesG = document.getElementById("frames");

  function el(tag, attrs){
    var e = document.createElementNS(SVGNS, tag);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function renderYear(f){
    var d = f.data;
    var lis = d.pts.map(function(p){ return "<li>"+p+"</li>"; }).join("");
    return '<div class="yearcard" style="border-top:5px solid '+f.accent+'"><p class="yr" style="color:'+f.accent+'">'+d.yr+'</p>' +
      '<p class="sub">'+d.sub+'</p><ul>'+lis+'</ul></div>';
  }
  function renderStep(f){
    var d = f.data;
    return '<div class="stepcard"><div class="num">'+d.n+'</div><h4>'+d.h+'</h4><p>'+d.p+'</p></div>';
  }
  function renderAud(f){
    var lis = f.pts.map(function(p){ return "<li>"+p+"</li>"; }).join("");
    return '<div class="card"><span class="tag '+f.tagClass+'">'+f.tagText+'</span><h2>Vad innebär det för er?</h2><ul>'+lis+'</ul></div>';
  }

  Object.keys(FRAMES).forEach(function(id){
    var f = FRAMES[id];
    var g = el("g", {"data-id": id, "class":"frame"});

    if(f.kind === "parent"){
      var wash = el("rect", {x:f.rect.x, y:f.rect.y, width:f.rect.w, height:f.rect.h, rx:28,
        class:"frame-wash"});
      g.appendChild(wash);
      var label = el("text", {x:f.rect.x+50, y:f.rect.y+95, "font-size":48, class:"frame-label"});
      label.textContent = f.label;
      g.appendChild(label);
      var hint = el("text", {x:f.rect.x+50, y:f.rect.y+140, "font-size":22, class:"frame-hint"});
      hint.textContent = "Zooma in för detaljer per del →";
      g.appendChild(hint);
    } else {
      var html;
      if(f.kind === "hub" || f.kind === "card" || f.kind === "areas") html = f.html;
      else if(f.kind === "year") html = renderYear(f);
      else if(f.kind === "step") html = renderStep(f);
      else if(f.kind === "aud") html = renderAud(f);

      var fo = el("foreignObject", {x:f.rect.x, y:f.rect.y, width:f.rect.w, height:f.rect.h});
      var div = document.createElementNS(XHTML, "div");
      div.setAttribute("style","width:100%;height:100%;");
      div.innerHTML = html;
      fo.appendChild(div);
      g.appendChild(fo);
    }
    framesG.appendChild(g);
    f.el = g;
  });

  // decorative path connecting the top-level stops
  (function drawPath(){
    var pts = ROOT_ORDER.map(function(id){
      var r = FRAMES[id].rect;
      return {x:r.x+r.w/2, y:r.y+r.h/2};
    });
    var d = "M " + pts.map(function(p){ return p.x+","+p.y; }).join(" L ");
    document.getElementById("path").setAttribute("d", d);
  })();

  // ---------------------------------------------------------------
  // 3. Kameran: animerar SVG-viewBox (ingen CSS-transform, ingen
  //    bitmap-cache) med enkel easing via requestAnimationFrame.
  // ---------------------------------------------------------------
  var svg = document.getElementById("stage");
  var current = "hub";
  var view = fitBox(FRAMES.hub.rect, 1.35);
  var animId = null;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function setViewBox(v){ svg.setAttribute("viewBox", v.x+" "+v.y+" "+v.w+" "+v.h); }
  setViewBox(view);

  function fitBox(r, pad){
    pad = pad || 1.18;
    var vp = {w: window.innerWidth, h: window.innerHeight};
    var vpAspect = vp.w/vp.h;
    var cx = r.x + r.w/2, cy = r.y + r.h/2;
    var targetAspect = r.w/r.h;
    var vbW, vbH;
    if(targetAspect > vpAspect){ vbW = r.w*pad; vbH = vbW/vpAspect; }
    else { vbH = r.h*pad; vbW = vbH*vpAspect; }
    return {x:cx-vbW/2, y:cy-vbH/2, w:vbW, h:vbH};
  }

  function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

  function animateTo(target, ms){
    if(animId) cancelAnimationFrame(animId);
    if(reduceMotion){ view = target; setViewBox(view); return; }
    var from = {x:view.x, y:view.y, w:view.w, h:view.h};
    var t0 = performance.now();
    ms = ms || 750;
    function step(now){
      var t = Math.min(1, (now-t0)/ms);
      var e = ease(t);
      view = {
        x: from.x + (target.x-from.x)*e,
        y: from.y + (target.y-from.y)*e,
        w: from.w + (target.w-from.w)*e,
        h: from.h + (target.h-from.h)*e
      };
      setViewBox(view);
      if(t < 1) animId = requestAnimationFrame(step);
      else animId = null;
    }
    animId = requestAnimationFrame(step);
  }

  function goTo(id, pad){
    current = id;
    var f = FRAMES[id];
    animateTo(fitBox(f.rect, pad || (f.kind==="parent" ? 1.08 : (f.kind==="hub"?1.35:1.18))));
    refreshChrome();
  }

  // ---- traversal helpers (siblings / parent / child) ----
  function siblingsOf(id){
    var p = FRAMES[id].parent;
    return p ? FRAMES[p].children : ROOT_ORDER;
  }
  function next(){
    var sibs = siblingsOf(current);
    var i = sibs.indexOf(current);
    goTo(sibs[(i+1) % sibs.length]);
  }
  function prev(){
    var sibs = siblingsOf(current);
    var i = sibs.indexOf(current);
    goTo(sibs[(i-1+sibs.length) % sibs.length]);
  }
  function enterChild(){
    var f = FRAMES[current];
    if(f.kind === "parent" && f.children.length) goTo(f.children[0]);
  }
  function exitToParent(){
    var f = FRAMES[current];
    if(f.parent) goTo(f.parent, 1.08);
    else if(current !== "hub") goTo("hub", 1.35);
  }
  function showWhole(){
    current = "hub";
    animateTo({x:-150,y:20,w:6650,h:2760});
    refreshChrome(true);
  }

  // ---- chrome: breadcrumb, dots, up-button, prev/next enabled state ----
  function refreshChrome(overview){
    var f = FRAMES[current];
    var crumb = document.getElementById("crumb");
    var up = document.getElementById("upbtn");
    var upLabel = document.getElementById("upbtn-label");

    if(overview){
      crumb.innerHTML = "Hela kartan";
      up.classList.remove("show");
    } else if(f.parent){
      var pLabel = FRAMES[f.parent].label;
      var childLabel = f.data ? (f.data.yr || f.data.h) : (f.tagText || "");
      crumb.innerHTML = pLabel + " <b>→ " + childLabel + "</b>";
      up.classList.add("show");
      upLabel.textContent = pLabel.toLowerCase();
    } else {
      crumb.innerHTML = "<b>" + (LABELS[current] || "") + "</b>";
      up.classList.toggle("show", current !== "hub");
      upLabel.textContent = "helheten";
    }
    buildDots();
  }

  function buildDots(){
    var sibs = siblingsOf(current);
    var wrap = document.getElementById("dots");
    wrap.innerHTML = "";
    sibs.forEach(function(id){
      var b = document.createElement("button");
      b.className = "dot" + (id===current ? " active" : "");
      b.setAttribute("aria-label", LABELS[id] || id);
      b.addEventListener("click", function(){ goTo(id); });
      wrap.appendChild(b);
    });
  }

  // ---- interactions ----
  Object.keys(FRAMES).forEach(function(id){
    FRAMES[id].el.addEventListener("click", function(e){
      e.stopPropagation();
      goTo(id);
    });
  });
  document.getElementById("bg").addEventListener("click", function(){ exitToParent(); });

  document.getElementById("prev").addEventListener("click", prev);
  document.getElementById("next").addEventListener("click", next);
  document.getElementById("upbtn").addEventListener("click", exitToParent);

  document.getElementById("zoomIn").addEventListener("click", function(){ zoomBy(0.78); });
  document.getElementById("zoomOut").addEventListener("click", function(){ zoomBy(1.28); });
  function zoomBy(factor){
    if(animId) cancelAnimationFrame(animId);
    var cx = view.x+view.w/2, cy = view.y+view.h/2;
    var w = view.w*factor, h = view.h*factor;
    view = {x:cx-w/2, y:cy-h/2, w:w, h:h};
    setViewBox(view);
  }

  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight" || e.key === "PageDown"){ next(); }
    else if(e.key === "ArrowLeft" || e.key === "PageUp"){ prev(); }
    else if(e.key === "ArrowDown" || e.key === "Enter"){ enterChild(); }
    else if(e.key === "ArrowUp" || e.key === "Backspace" || e.key === "Escape"){ exitToParent(); }
    else if(e.key === "0" || e.key === "Home"){ showWhole(); }
    else if(e.key === "+" || e.key === "="){ zoomBy(0.85); }
    else if(e.key === "-"){ zoomBy(1.18); }
  });

  // free pan (wheel) and pinch/ctrl-wheel zoom — still viewBox-driven, still crisp
  var viewport = svg;
  viewport.addEventListener("wheel", function(e){
    e.preventDefault();
    if(animId) cancelAnimationFrame(animId);
    var scale = view.w / window.innerWidth;
    if(e.ctrlKey || e.metaKey){
      var factor = Math.exp(e.deltaY * 0.0018);
      var mx = view.x + (e.clientX/window.innerWidth)*view.w;
      var my = view.y + (e.clientY/window.innerHeight)*view.h;
      var w = view.w*factor, h = view.h*factor;
      view = {
        x: mx - (e.clientX/window.innerWidth)*w,
        y: my - (e.clientY/window.innerHeight)*h,
        w:w, h:h
      };
    } else {
      view = {x:view.x + e.deltaX*scale, y:view.y + e.deltaY*scale, w:view.w, h:view.h};
    }
    setViewBox(view);
  }, {passive:false});

  window.addEventListener("resize", function(){ goTo(current); });

  // audience quick-jump in the top bar
  document.querySelectorAll(".audience button").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".audience button").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      goTo(btn.getAttribute("data-aud"));
    });
  });

  refreshChrome();
})();
</script>
